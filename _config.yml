# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Abhishek Bagade — Writing
email: bagdeabhishek@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  First-hand essays and practical guides on systems, machine learning, electronics,
  repairs, and the things I learn by building.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://abagade.com" # the base hostname & protocol for your site, e.g. http://example.com
lang: en-IN
author:
  name: Abhishek Bagade
logo: /images/profile_pic.jpg
twitter_username: bagdeabizek
github_username:  bagdeabhishek
facebook:
  app_id: 2503151523291173
  publisher: "https://www.facebook.com/bagdeabhishek"
  admins: "https://www.facebook.com/bagdeabhishek"
twitter:
  username: bagdeabizek
  card: summary
social:
  name: Abhishek Bagade
  links:
    - https://twitter.com/bagdeabizek
    - https://www.facebook.com/bagdeabhishek
    - https://www.linkedin.com/in/bagdeabhishek
    - https://github.com/bagdeabhishek
    - https://www.goodreads.com/bagdeabhishek
# Build settings
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
theme: jekyll-theme-hacker
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from  
whitelist:
  - jekyll-redirect-from
# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
exclude:
  - README.md
  - vendor/bundle
  - vendor/cache
  - vendor/gems
  - vendor/ruby
