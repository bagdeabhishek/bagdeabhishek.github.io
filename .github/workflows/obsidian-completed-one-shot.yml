name: One-shot Obsidian Completed publish
on:
  push:
    paths:
      - .github/workflows/obsidian-completed-one-shot.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified payload and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://litter.catbox.moe/gqyfaf.zip -o /tmp/payload.zip
          echo '0ae8e8fb7085b784e1095b94d9a138c9c02fdac062649c3b96b20b71fe9ff2bc  /tmp/payload.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/payload.zip') as z:
              z.extractall('/tmp/payload')
          PY
          cp -a /tmp/payload/musings/. musings/
          rm .github/workflows/obsidian-completed-one-shot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add musings .github/workflows/obsidian-completed-one-shot.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync completed Obsidian research notes (2026-07-13)'
          git push origin master
# trigger after workflow registration
