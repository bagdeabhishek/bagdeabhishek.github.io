<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

{% seo %}
  </head>

  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <div class="container header-inner">
        <div class="site-identity">
          <a class="site-title" href="{{ '/' | relative_url }}">Abhishek Bagade</a>
          <p class="site-kicker">Long-form writing, notes, and field guides.</p>
        </div>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Writing</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
          <a href="https://abhishekdoesstuff.com">Projects <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main class="container" id="main-content">
      <section id="main_content">
        {{ content }}
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>First-hand writing at abagade.com. Project briefs and build logs at <a href="https://abhishekdoesstuff.com">abhishekdoesstuff.com</a>.</p>
        <p><a href="https://github.com/{{ site.github_username }}">GitHub</a> · <a href="mailto:{{ site.email }}">Email</a></p>
      </div>
    </footer>
  </body>
</html>
